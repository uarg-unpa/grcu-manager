{% load static %}

<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GRCU Manager{% endblock %}</title>

    <link rel="shortcut icon" href="{% static 'accounts/img/favicon.png' %}" type="image/png">
    <link rel="stylesheet" href="{% static 'core/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/bootstrap-icons.min.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/base_styles.css' %}">

    {% block extra_css %}
    {% endblock %}

</head>
<body>
    <!-- Mensajes de Django (success, error, warning, info) -->
    {% if messages %}
        <div class="container-fluid mt-3">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show django-message" role="alert" data-message-key="{{ message|slugify }}">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        </div>
        <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.django-message').forEach(function(alert) {
                var key = alert.getAttribute('data-message-key');
                var seen = sessionStorage.getItem('django_message_' + key);
                if (seen === '1') {
                    setTimeout(function() {
                        var bsAlert = bootstrap.Alert.getOrCreateInstance(alert);
                        bsAlert.close();
                    }, 15000);
                } else {
                    sessionStorage.setItem('django_message_' + key, '1');
                }
            });
        });
        </script>
    {% endif %}

    <!-- Contenido principal -->
    {% block content %}
    {% endblock %}

    <!-- Bootstrap JS -->
    <script src="{% static 'core/js/bootstrap.bundle.min.js' %}"></script>
    
    <!-- Core Base JavaScript -->
    <script src="{% static 'core/js/base.js' %}?v=1.0"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
