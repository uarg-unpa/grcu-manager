{% extends "core/base.html" %}

{% load static %}

{% block content %}
<div class="grupo-eliminar-container">
    <h2 class="grupo-eliminar-titulo">Eliminar Grupo</h2>
    <p>¿Estás seguro de que deseas eliminar el grupo <strong>{{ grupo.nombre }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="grupo-eliminar-btn-confirmar">Sí, eliminar</button>
        <a href="{% url 'grupos:lista_grupos' %}" class="grupo-eliminar-btn-cancelar">Cancelar</a>
    </form>
</div>
{% endblock %}
