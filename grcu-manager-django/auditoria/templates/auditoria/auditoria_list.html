{% if messages %}
    <div class="container-fluid mt-3">
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show django-message" role="alert" data-message-key="{{ message|slugify }}">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    </div>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.django-message').forEach(function(alert) {
            var key = alert.getAttribute('data-message-key');
            var seen = sessionStorage.getItem('django_message_' + key);
            if (seen === '1') {
                setTimeout(function() {
                    var bsAlert = bootstrap.Alert.getOrCreateInstance(alert);
                    bsAlert.close();
                }, 15000);
            } else {
                sessionStorage.setItem('django_message_' + key, '1');
            }
        });
    });
    </script>
{% endif %}
