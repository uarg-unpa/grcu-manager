{% extends 'core/base.html' %}
<script src="{% static 'core/js/bootstrap.bundle.min.js' %}"></script>
<script src="{% static 'usuarios/js/usuario_form.js' %}?v=1.0"></script>
                {% endfor %}
            </div>
        </div>

        {% if form.is_active %}
        <div class="mb-3">
            <label class="form-label">¿El usuario está activo?</label>
            <div class="active-status-container">
                <label class="active-status-toggle">
                    <input type="checkbox" name="is_active" {% if form.is_active.value %}checked{% endif %} hidden>
                    <span class="active-status-text">
                        {% if form.is_active.value %}Sí, activo{% else %}No, inactivo{% endif %}
                    </span>
                    <span class="active-status-slider"></span>
                </label>
            </div>
        </div>
        {% endif %}

    <button type="submit" class="btn btn-primary" title="Actualizar usuario" data-bs-toggle="tooltip"><i class="bi bi-check-lg"></i> Actualizar</button>
    <a href="{% url 'usuarios:lista' %}" class="btn btn-secondary" title="Cancelar" data-bs-toggle="tooltip"><i class="bi bi-x-lg"></i> Cancelar</a>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'core/js/bootstrap.bundle.min.js' %}"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const setBadgeState = (badge, isChecked) => {
        badge.classList.toggle('active', isChecked);
        badge.classList.toggle('inactive', !isChecked);
        badge.setAttribute('aria-checked', isChecked);
    };

    document.querySelectorAll('.roles-badge').forEach(badge => {
        const checkbox = badge.querySelector('input[type="checkbox"]');
        badge.setAttribute('role', 'checkbox');
        badge.setAttribute('tabindex', '0');

        // Aplicar estado inicial basado en si el checkbox está marcado
        setBadgeState(badge, checkbox.checked);

        badge.addEventListener('click', function(event) {
            event.preventDefault();
            checkbox.checked = !checkbox.checked;
            setBadgeState(badge, checkbox.checked);
        });

        badge.addEventListener('keydown', function(event) {
            if (event.key === ' ' || event.key === 'Enter') {
                event.preventDefault();
                checkbox.checked = !checkbox.checked;
                setBadgeState(badge, checkbox.checked);
            }
        });
    });

    // Manejar el toggle del estado activo
    const activeToggle = document.querySelector('.active-status-toggle');
    if (activeToggle) {
        const checkbox = activeToggle.querySelector('input[type="checkbox"]');
        const textElement = activeToggle.querySelector('.active-status-text');

        const updateToggleText = () => {
            textElement.textContent = checkbox.checked ? 'Sí, activo' : 'No, inactivo';
        };

        // Aplicar estado inicial
        updateToggleText();

        activeToggle.addEventListener('click', function(event) {
            event.preventDefault();
            checkbox.checked = !checkbox.checked;
            updateToggleText();
        });

        activeToggle.addEventListener('keydown', function(event) {
            if (event.key === ' ' || event.key === 'Enter') {
                event.preventDefault();
                checkbox.checked = !checkbox.checked;
                updateToggleText();
            }
        });
    }
});
</script>
{% endblock %}
