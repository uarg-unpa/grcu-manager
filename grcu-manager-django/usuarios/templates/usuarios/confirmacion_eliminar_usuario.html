{% extends "core/base.html" %}

{% load static %}

{% block title %}Eliminar Usuario{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'usuarios/css/confirmacion_eliminar_usuario.css' %}">
{% endblock %}

{% block content %}
<div class="confirmacion-eliminar-container">
    <p>¿Estás seguro de que deseas eliminar al usuario <strong>{{ user.nombre }}</strong> ({{ user.email }})?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'usuarios:lista' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
