{% extends "core/base.html" %}

{% load static %}

{% block title %}Administrador Configurado{% endblock %}

{% block content %}

    <h3 class="mb-4 text-center">¡Administrador Configurado!</h3>
    <p class="text-muted text-center">El administrador con el correo <strong>{{ email }}</strong> ha sido configurado exitosamente.</p>
    <div class="d-grid">
      <a href="{% url 'dashboards:admin_dashboard' %}" class="btn btn-primary">Ir al Panel de Administración</a>

  </div>

{% endblock %}
